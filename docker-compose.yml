# The database is the cloud Postgres in DATABASE_URL (Neon, Supabase...). Nothing is stored on this server.
services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      - SYNC_KEY=${SYNC_KEY:-change-me}
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80","443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile","caddy:/data"]
volumes:
  caddy: {}
