<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Samket · Shop</title><meta name=theme-color content="#0f5c46"><link rel=manifest href=manifest.json><link rel=icon href=icon.svg><link rel=stylesheet href=style.css>
<style>.pr{display:none}@media print{body>*:not(.pr){display:none!important}.pr{display:block;font:14px monospace;color:#000;background:#fff;padding:10px}}.tabs a{padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mu);white-space:nowrap;font-weight:700}.tabs a.on{background:var(--tx);color:var(--bg)}.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{display:grid;gap:14px;grid-template-columns:1.4fr 1fr}@media(max-width:800px){.two{grid-template-columns:1fr}}@media(max-width:700px){.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);padding:8px;justify-content:space-around;box-shadow:0 -6px 24px #0003;z-index:9}#m{padding-bottom:96px!important}}</style></head><body>
<div class=nav><div class=w><span class=logo>SAMKET<i>.</i></span><div class=tabs id=tb style="display:flex;gap:4px"></div><span class=sp></span><span id=st class=tag></span></div></div>
<main class=w id=m style="padding:20px 18px 60px"></main><div class=pr id=pr></div>
<footer class=w style="padding:0 20px 90px;color:var(--mu);font-size:14px">© <span id=yr></span> Samket Technologies · Powered by Mafi Technologies</footer>
<script src=db.js></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';'),mn=n=>(+n||0).toLocaleString()+' ETB',fd=t=>new Date(t).toLocaleDateString();
const TABS=['Home','Stock','Sell','Sales','Money','Repairs','Settings'],ST=['Requested','Received','Diagnosing','Waiting parts','Repaired','Delivered','Unrepairable'];
let V='Home',D={},cart=[],q='',C={n:'',p:'',d:0,m:'Cash'};
const stock=id=>D.move.filter(m=>m.item===id).reduce((a,m)=>a+m.q,0),low=i=>stock(i.id)<=i.min;
const addD=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const sv=async(t,o)=>{const r=await save(t,o);sync().then(R);return r};
const pr=h=>{$('#pr').innerHTML=h;print()};
async function R(){for(const t of['item','move','sale','ticket','exp'])D[t]=await all(t);
 $('#tb').innerHTML=TABS.map(t=>`<a class="${t==V?'on':''}" onclick="V='${t}';q='';R()">${t}${t=='Stock'&&D.item.some(low)?' ⚠':''}</a>`).join('');
 const lw=D.item.filter(low);document.title=(lw.length?'('+lw.length+') ':'')+'Samket · Shop';$('#m').innerHTML=(lw.length&&V!='Home'?`<div class=card style="border-color:var(--bad);margin-bottom:14px"><span class="tag bad">Low stock</span> ${lw.slice(0,5).map(i=>esc(i.name)+' ('+stock(i.id)+')').join(', ')}</div>`:'')+VW[V]();const s=$('#q');if(s&&q){s.focus();s.setSelectionRange(99,99)}
 const p=await pending();$('#st').className='tag '+(p||!navigator.onLine?'warn':'ok');$('#st').textContent=(navigator.onLine?'● ':'○ offline · ')+(p?p+' to sync':'synced')}
const VW={
Home(){const t0=new Date().setHours(0,0,0,0),ts=D.sale.filter(s=>s.date>=t0),lw=D.item.filter(low);
 return `<div class=row>${[['Sales today',mn(ts.reduce((a,s)=>a+s.total,0))],['Items',D.item.length],['Low on stock',lw.length],['Open repairs',D.ticket.filter(t=>!['Delivered','Unrepairable'].includes(t.status)).length]].map(([a,b])=>`<div class=card><div class=mu>${a}</div><div class=big>${b}</div></div>`).join('')}</div><div class=card style=margin-top:14px><h2>Needs restocking</h2>${lw.length?`<div class=tw><table>${lw.map(i=>`<tr><td>${esc(i.name)}<td><span class="tag bad">${stock(i.id)} left</span><td>limit ${i.min}<td><button class="btn s" onclick="rcv('${i.id}')">Add stock</button></tr>`).join('')}</table></div>`:'<p class=mu>Everything is above its limit.</p>'}${D.item.length?'':'<br><button class=btn onclick=seed()>Load sample items</button>'}</div>`},
Stock(){const L=D.item.filter(i=>(i.name+i.cat).toLowerCase().includes(q.toLowerCase()));
 return `<div style="display:flex;gap:8px;margin-bottom:12px"><input id=q placeholder="Search items" value="${esc(q)}" oninput="q=this.value;R()"><button class=btn onclick="itm()">New item</button></div><div class="card tw"><table><tr><th>Item<th>Stock<th>Limit<th>Price<th>Warranty<th></tr>${L.map(i=>`<tr><td>${i.img?`<img src="${i.img}" alt="" width=38 height=38 style="border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:8px">`:''}${esc(i.name)}<br><small class=mu>${esc(i.cat)}</small><td><span class="tag ${low(i)?'bad':'ok'}">${stock(i.id)}</span><td>${i.min}<td>${mn(i.price)}<td>${i.war||0} d<td><button class="btn g s" onclick="rcv('${i.id}')">Add stock</button> <button class="btn g s" onclick="itm('${i.id}')">Edit</button> <button class="btn g s" onclick="del('${i.id}')">Delete</button></tr>`).join('')}</table></div>`},
Sell(){const L=D.item.filter(i=>(i.name+i.cat).toLowerCase().includes(q.toLowerCase())),t=cart.reduce((a,l)=>a+l.price*l.q,0);
 return `<div class=two><div><input id=q placeholder="Search items to sell" value="${esc(q)}" oninput="q=this.value;R()"><div class=grid style="margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${L.map(i=>`<div class=card onclick="add('${i.id}')" style=cursor:pointer><b>${esc(i.name)}</b><div>${mn(i.price)}</div><span class="tag ${low(i)?'bad':'ok'}">${stock(i.id)} in stock</span></div>`).join('')}</div></div><div class=card><h2>Sale</h2>${cart.map((l,k)=>`<div style="margin:10px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--bd)"><div style="display:flex;align-items:center"><b style=flex:1>${esc(l.name)}</b><button class="btn g s" onclick="cart.splice(${k},1);R()">✕</button></div><div style="display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:8px"><div><label>Qty</label><input type=number min=1 value=${l.q} onchange="cart[${k}].q=Math.max(1,+this.value);R()"></div><div><label>Price</label><input type=number min=0 placeholder="${l.base}" value="${l.price!=l.base?l.price:''}" onchange="cart[${k}].price=+this.value||cart[${k}].base;R()"></div><div><label>Warranty days</label><input type=number min=0 value=${l.war} onchange="cart[${k}].war=+this.value||0;R()"></div></div></div>`).join('')||'<p class=mu>Tap an item to add it.</p>'}<label>Customer</label><input value="${esc(C.n)}" oninput="C.n=this.value"><label>Phone</label><input value="${esc(C.p)}" oninput="C.p=this.value"><label>Discount (ETB)</label><input type=number min=0 value="${C.d||''}" onchange="C.d=+this.value;R()"><label>Payment</label><select onchange="C.m=this.value">${['Cash','Bank transfer','Telebirr','CBE Birr'].map(x=>`<option ${C.m==x?'selected':''}>${x}</option>`).join('')}</select><div class=big style="margin:12px 0">${mn(Math.max(0,t-(C.d||0)))}</div><button class=btn style=width:100% ${cart.length?'':'disabled'} onclick=chk()>Complete sale</button></div></div>`},
Repairs(){const L=D.ticket.filter(t=>JSON.stringify(t).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.ts-a.ts);
 return `<div style="display:flex;gap:8px;margin-bottom:12px"><input id=q placeholder="Search name, phone, IMEI, code" value="${esc(q)}" oninput="q=this.value;R()"><button class=btn onclick="tkt()">New ticket</button></div><div class="card tw"><table><tr><th>Code<th>Customer<th>Device<th>Status<th></tr>${L.map(t=>`<tr><td class=code>${t.code}<td>${esc(t.name)}<br><small class=mu>${esc(t.phone)}</small><td>${esc(t.device)}<br><small class=mu>${esc(t.imei)}</small><td><span class="tag ${['Requested','Received','Diagnosing','Waiting parts'].includes(t.status)?'warn':t.status=='Unrepairable'?'bad':'ok'}">${t.status}</span><td><button class="btn g s" onclick="tkt('${t.id}')">Open</button> <button class="btn g s" onclick="ptk('${t.id}')">Print</button></tr>`).join('')}</table></div>`},
Sales(){const L=D.sale.filter(s=>JSON.stringify(s).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date-a.date),cost=s=>s.lines.reduce((a,l)=>a+((D.item.find(i=>i.id==l.id)||{}).cost||0)*l.q,0),ok=L.filter(s=>!s.void),n=new Date().toISOString().slice(0,10);
 return `<div class=row style=margin-bottom:12px><div class=card><div class=mu>Revenue</div><div class=big>${mn(ok.reduce((a,s)=>a+s.total,0))}</div></div><div class=card><div class=mu>Profit</div><div class=big>${mn(ok.reduce((a,s)=>a+s.total-cost(s),0))}</div></div></div><input id=q placeholder="Search receipt, customer, phone, item" value="${esc(q)}" oninput="q=this.value;R()" style=margin-bottom:12px><div class="card tw"><table><tr><th>Receipt<th>Customer<th>Items and warranty<th>Total<th></tr>${L.map(s=>`<tr><td class=code>${s.code}<br><small class=mu>${fd(s.date)}</small><td>${esc(s.name)}<br><small class=mu>${esc(s.phone)}</small><td>${s.lines.map(l=>l.q+'× '+esc(l.name)+` <span class="tag ${!l.until?'':l.until>=n?'ok':'bad'}">${!l.until?'no warranty':l.until>=n?'warranty to '+l.until:'warranty ended'}</span>`).join('<br>')}<td>${mn(s.total)}<br><small class=mu>${esc(s.pay||'')}</small><td>${s.void?'<span class="tag bad">Refunded</span>':`<button class="btn g s" onclick="rfd('${s.id}')">Refund</button>`}</tr>`).join('')}</table></div>`},
Money(){const m=window.MO||new Date().toISOString().slice(0,7),inM=t=>t&&new Date(t).toISOString().slice(0,7)==m,cst=s=>s.lines.reduce((a,l)=>a+((D.item.find(i=>i.id==l.id)||{}).cost||0)*l.q,0),
 ss=D.sale.filter(s=>!s.void&&inM(s.date)),sr=ss.reduce((a,s)=>a+s.total,0),sp=sr-ss.reduce((a,s)=>a+cst(s),0),
 rs=D.ticket.filter(t=>inM(t.done)),rr=rs.reduce((a,t)=>a+t.cost,0),rp=rr-rs.reduce((a,t)=>a+(t.pcost||0),0),
 ex=D.exp.filter(e=>e.kind=='Fixed'?e.date.slice(0,7)<=m&&(!e.stop||e.stop.slice(0,7)>=m):e.date.slice(0,7)==m),
 fx=ex.filter(e=>e.kind=='Fixed').reduce((a,e)=>a+e.amt,0),vx=ex.filter(e=>e.kind!='Fixed').reduce((a,e)=>a+e.amt,0),
 K=(a,b,c)=>`<div class=card><div class=mu>${a}</div><div class=big>${mn(b)}</div><div class=mu>${c||''}</div></div>`;
 return `<div style="display:flex;gap:8px;margin-bottom:14px"><input type=month value=${m} onchange="MO=this.value;R()" style=max-width:200px><button class=btn onclick="expn()">Add expense</button></div><div class=row>${K('Selling revenue',sr,'profit '+mn(sp))}${K('Repair revenue',rr,'profit '+mn(rp))}${K('Fixed expenses',fx,'repeat monthly')}${K('Variable expenses',vx,'this month only')}${K('Net profit',sp+rp-fx-vx,'after all expenses')}</div><div class="card tw" style=margin-top:14px><h2>Expenses</h2><table>${ex.map(e=>`<tr><td>${esc(e.name)}<br><small class=mu>${e.cat}</small><td><span class=tag>${e.kind}</span><td>${mn(e.amt)}<td><button class="btn g s" onclick="expn('${e.id}')">Edit</button> <button class="btn g s" onclick="xdel('${e.id}')">Delete</button></tr>`).join('')||'<tr><td class=mu>No expenses this month.</tr>'}</table></div>`},
Settings(){return `<div class=card style=max-width:520px><h2>Sync and security</h2><label>Server URL (blank = this site)</label><input id=su value="${esc(localStorage.surl||'')}"><label>Sync key</label><input id=sk value="${esc(localStorage.skey||'samket')}"><label>Admin PIN</label><input id=sp value="${esc(localStorage.pin||'1234')}"><p class=mu style="margin:10px 0">Device ID: ${dev}. Works offline; changes sync every 20 seconds when the server is reachable.</p><button class=btn onclick=setg()>Save and sync</button><hr style="margin:18px 0;border:0;border-top:1.5px solid var(--bd)"><b>Backup</b><p class=mu style="margin:6px 0 10px">Keep a copy of all shop data, or restore one.</p><button class="btn g" onclick=bak()>Download backup</button> <label class="btn g" style=margin:0><input type=file accept=.json hidden onchange=rst(this.files[0])>Restore backup</label></div>`}};
function form(t,f,v,cb){const d=document.createElement('dialog');
 d.innerHTML=`<h2>${t}</h2><form method=dialog>${f.map(([k,l,ty,o])=>`<label>${l}</label>`+(ty=='sel'?`<select name=${k}>${o.map(x=>`<option ${v[k]==x?'selected':''}>${x}</option>`).join('')}</select>`:ty=='area'?`<textarea name=${k} rows=3>${esc(v[k])}</textarea>`:`<input name=${k} type=${ty||'text'} value="${esc(v[k])}">`)).join('')}<div style="display:flex;gap:8px;margin-top:14px"><button class=btn>Save</button><button class="btn g" type=button onclick="this.closest('dialog').close()">Cancel</button></div></form>`;
 document.body.append(d);d.showModal();d.onclose=()=>d.remove();
 d.querySelector('form').onsubmit=async e=>{await cb({...v,...Object.fromEntries(new FormData(e.target))});await R()}}
function itm(id){const i=D.item.find(x=>x.id==id)||{cat:'Phones',min:2,war:0,pub:true,price:0,cost:0};
 form(id?'Edit item':'New item',[['name','Name'],['cat','Category','sel',['Phones','Laptops','Desktops','Parts','Accessories']],['price','Listed price (editable at sale)','number'],['cost','Cost','number'],['min','Low-stock limit','number'],['war','Default warranty (days)','number'],['file','Photo','file'],['pub','Show on website','sel',['yes','no']],...(id?[]:[['qty','Opening stock','number']])],{...i,pub:i.pub===false?'no':'yes'},async o=>{const{qty,file,...r}=o;if(file&&file.size)r.img=await shrink(file);const it=await sv('item',{...r,price:+r.price,cost:+r.cost,min:+r.min,war:+r.war,pub:r.pub=='yes'});if(+qty)await sv('move',{item:it.id,q:+qty,ref:'opening'})})}
const rcv=id=>form('Add stock',[['q','Quantity received','number']],{q:1},o=>sv('move',{item:id,q:+o.q,ref:'receive'}));
function tkt(id){const t=D.ticket.find(x=>x.id==id)||{status:'Received',war:0,cost:0,pcost:0};
 form(id?'Ticket '+t.code:'New repair ticket',[['name','Customer'],['phone','Phone','tel'],['email','Email (optional)','email'],['dtype','Device type','sel',['Phone','Laptop','Desktop','Tablet','Other']],['device','Brand and model'],['imei','IMEI / serial / device ID'],['issue','Problem','area'],['work','Work done','area'],['cost','Price charged','number'],['pcost','Parts cost','number'],['war','Warranty (days)','number'],['status','Status','sel',ST]],t,o=>sv('ticket',{...o,code:o.code||nextCode('SK'),cost:+o.cost,pcost:+o.pcost||0,war:+o.war||0,date:o.date||Date.now(),done:['Repaired','Delivered'].includes(o.status)?(o.done||Date.now()):null}))}
function ptk(id){const t=D.ticket.find(x=>x.id==id),u=t.done?new Date(t.done+t.war*864e5).toLocaleDateString():'after repair';
 pr(`<h2>SAMKET TECHNOLOGIES</h2><h3>Repair ticket ${t.code}</h3><p>${fd(t.date)}<br>Customer: ${esc(t.name)} ${esc(t.phone)}<br>Device: ${esc(t.device)}<br>IMEI/ID: ${esc(t.imei)}<br>Problem: ${esc(t.issue)}<br>Work done: ${esc(t.work)}<br>Status: ${t.status}<br>Price: ${mn(t.cost)}<br>${t.war>0?'Warranty: '+t.war+' days (until '+u+')':'No warranty'}</p>`)}
function add(id){const i=D.item.find(x=>x.id==id),l=cart.find(x=>x.id==id);if(stock(id)<=(l?l.q:0)&&!confirm('Stock shows none left. Add anyway?'))return;l?l.q++:cart.push({id,name:i.name,base:i.price,price:i.price,q:1,war:i.war||0});R()}
async function chk(){const L=cart.map(l=>({...l,until:l.war>0?addD(l.war):''})),s=await save('sale',{code:nextCode('RC'),name:C.n,phone:C.p,lines:L,total:Math.max(0,L.reduce((a,l)=>a+l.price*l.q,0)-(C.d||0)),disc:C.d||0,pay:C.m,date:Date.now()});
 for(const l of L)await save('move',{item:l.id,q:-l.q,ref:s.id});cart=[];C={n:'',p:'',d:0,m:'Cash'};await R();
 pr(`<h2>SAMKET TECHNOLOGIES</h2><p>Receipt ${s.code}, ${fd(s.date)}<br>${esc(s.name)} ${esc(s.phone)}</p>${L.map(l=>`<p>${l.q} × ${esc(l.name)}: ${mn(l.price*l.q)}<br>${l.until?'Warranty until '+l.until:'No warranty'}</p>`).join('')}<p>Discount ${mn(s.disc)}, paid by ${esc(s.pay)}</p><h3>Total ${mn(s.total)}</h3><p>Keep this receipt for warranty claims.</p>`);sync().then(R)}
async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,400/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)}
const del=async id=>{const i=D.item.find(x=>x.id==id);if(confirm('Delete '+i.name+'?'))await sv('item',{...i,del:true})};
async function rfd(id){const s=D.sale.find(x=>x.id==id);if(!confirm('Refund '+s.code+'? Items go back to stock.'))return;await sv('sale',{...s,void:true});for(const l of s.lines)await save('move',{item:l.id,q:l.q,ref:'refund '+s.code});R()}
async function bak(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(await everything())]));a.download='samket-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
async function rst(f){if(!f)return;for(const x of JSON.parse(await f.text())){const l=await get(x.id);if(!l||x.ts>l.ts)await put({...x,dirty:1})}await R();sync().then(R)}
function expn(id){const e=D.exp.find(x=>x.id==id)||{kind:'Variable',cat:'Parts',date:new Date().toISOString().slice(0,10)};
 form(id?'Edit expense':'New expense',[['name','What for'],['amt','Amount (ETB)','number'],['kind','Type (fixed repeats monthly)','sel',['Fixed','Variable']],['cat','Category','sel',['Rent','Salary','Utilities','Parts','Transport','Food','Other']],['date','Date (fixed: start)','date'],['stop','Fixed: stops on (optional)','date']],e,o=>sv('exp',{...o,amt:+o.amt||0}))}
const xdel=async id=>{if(confirm('Delete this expense?'))await sv('exp',{...D.exp.find(x=>x.id==id),del:true})};
function setg(){localStorage.surl=$('#su').value.trim().replace(/\/$/,'');localStorage.skey=$('#sk').value;localStorage.pin=$('#sp').value;sync().then(R)}
async function seed(){for(const[n,c,p,k,m,w,q]of[['iPhone 13 128GB','Phones',78000,70000,2,6,5],['Samsung A15','Phones',19500,16500,3,6,8],['Dell Latitude 7490','Laptops',42000,36000,2,3,4],['Phone screen (generic)','Parts',1800,900,5,1,10],['USB-C charger 25W','Accessories',900,450,5,3,12]]){const i=await save('item',{name:n,cat:c,price:p,cost:k,min:m,war:w,pub:true});await save('move',{item:i.id,q,ref:'opening'})}R()}
function boot(){$('#yr').textContent=new Date().getFullYear();if(sessionStorage.ok){R();setInterval(()=>sync().then(R),20000);sync().then(R);return}
 $('#m').innerHTML='<div class=card style="max-width:340px;margin:12vh auto"><h2>Samket shop</h2><label>PIN</label><input id=pn type=password inputmode=numeric onkeydown="event.key==\'Enter\'&&go()"><br><br><button class=btn style=width:100% onclick=go()>Unlock</button></div>'}
function go(){if($('#pn').value==(localStorage.pin||'1234')){sessionStorage.ok=1;boot()}else $('#pn').value=''}
addEventListener('online',()=>sync().then(R));addEventListener('offline',R);navigator.serviceWorker&&navigator.serviceWorker.register('sw.js');boot();
</script></body></html>
